# Format: window <role> <agent> <worktree> [task|batch] [extra-cli-args...]
# The optional receive mode defaults to task. Use batch for roles that should
# consume all currently queued equal-priority handoffs as one batch.
# Any fields after the receive mode are passed to the agent CLI, e.g. --yolo.
#
# four-pack + pi on Linux: un solo harness (pi), un modelo por rol.
# Todos los modelos viven en el provider qwen-token-plan (una sola API key):
#   - specifier/coder  → deepseek (familia DeepSeek)
#   - refactorer       → qwen    (familia Qwen)
#   - architect        → glm     (familia GLM)
# Verificar ids con: pi --list-models qwen-token-plan
window specifier pi master --model qwen-token-plan/deepseek-v4-pro
window coder pi coder --model qwen-token-plan/deepseek-v4-pro
window refactorer pi refactorer batch --model qwen-token-plan/qwen3.7-max
window architect pi architect batch --model qwen-token-plan/glm-5.2
